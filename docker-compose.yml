# Project-local Graphify knowledge graph — CLI mode (no MCP server).
#
# One service, one image (graphify/Dockerfile), driven by the `graphify` CLI:
#   • extract (default) — (re)generate graphify-out/ from the source.
#         docker compose run --rm graphify
#   • query             — search the graph in natural language.
#         docker compose run --rm graphify query "what plays the tap sounds?"
#
# The post-commit hook runs the extract; scripts/graph-query.sh runs queries.
# Semantic queries use an LLM if one of the *_API_KEY vars is set; plain code
# structure queries work with no key at all.
name: yes-no-app

services:
  graphify:
    build: ./graphify
    image: yes-no-app-graphify:latest
    working_dir: /workspace
    entrypoint: ["graphify"]
    command: ["extract", ".", "--force"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./:/workspace
